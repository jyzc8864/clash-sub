name: Update Clash subscription

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch the latest proxy
        env:
          ZDOPEN_API_URL: ${{ secrets.ZDOPEN_API_URL }}
        run: python update_subscription.py
      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash.yaml
          git diff --cached --quiet || git commit -m "Update Clash subscription"
          git push
